    <rect x="12" y="24" width="60" height="30" rx="4" fill="#ffffff"/>
    <text x="42" y="44" font-size="12" font-weight="700" fill="#202124" text-anchor="middle">50kg</text>
  </g>
  <!-- blocks -->
  <g transform="translate(168 268)" fill="#c5a880" stroke="#8d6e63" stroke-width="1.5">
    <rect x="0" y="22" width="44" height="22" rx="2"/><rect x="46" y="22" width="44" height="22" rx="2"/><rect x="22" y="0" width="44" height="22" rx="2"/>
  </g>
